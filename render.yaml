# Render Blueprint: New > Blueprint > pick this repo. Set SARVAM_API_KEY when prompted.
services:
  - type: web
    name: leadpilot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SARVAM_API_KEY
        sync: false
      - key: LEADPILOT_SECRET
        generateValue: true
      - key: TZ
        value: Asia/Kolkata
